<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golex — Text Scenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --royal:#2357E8;
  --royal-dark:#1A46CC;
  --royal-light:#3B7CF6;
  --font-brand:'Syne',system-ui,sans-serif;
  --font-display:'Outfit',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(0.4,0,0.2,1);
  --ease-spring:cubic-bezier(0.34,1.28,0.64,1);
}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--royal);
  color:#fff;
  font-family:var(--font-display);
}

/* ── Subtle atmospheric layers on the royal blue ── */
#bg-glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 60% at 30% 30%,rgba(255,255,255,0.06) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 75% 75%,rgba(59,124,246,0.25) 0%,transparent 65%),
    radial-gradient(ellipse 50% 50% at 50% 50%,rgba(26,70,204,0.15) 0%,transparent 70%);
}
#bg-grid{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.18;
  background-image:radial-gradient(circle,rgba(255,255,255,0.18) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,rgba(0,0,0,0.5) 0%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,rgba(0,0,0,0.5) 0%,transparent 80%);
}
#vignette{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 110% 100% at 50% 50%,transparent 55%,rgba(13,30,90,0.45) 100%);
}

/* ── Scene framework ── */
#stage{position:fixed;inset:0;z-index:10;}
.scene{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 0.6s var(--ease),transform 0.7s var(--ease-spring),filter 0.5s var(--ease);
  transform:translateY(20px) scale(0.97);
  filter:blur(4px);
}
.scene.active{
  opacity:1;pointer-events:auto;
  transform:translateY(0) scale(1);
  filter:blur(0);
}
.scene.exit{
  opacity:0;
  transform:translateY(-20px) scale(0.98);
  filter:blur(4px);
}

/* ── Text styles — clean and professional ── */
.text-wrap{
  text-align:center;
  position:relative;
  padding:0 24px;
}
.scene-text{
  font-family:var(--font-brand);
  font-weight:800;
  color:#fff;
  letter-spacing:-0.03em;
  line-height:1.05;
  font-size:clamp(28px,6.5vw,82px);
  position:relative;
  display:inline-block;
}

/* ── Per-word animation wrapper ── */
.word{
  display:inline-block;
  opacity:0;
  transform:translateY(28px);
  filter:blur(8px);
  animation:wordIn 0.85s var(--ease-spring) forwards;
}
.scene.active .word{ animation-play-state:running; }
.word:nth-child(1){ animation-delay:0.15s; }
.word:nth-child(2){ animation-delay:0.32s; }
.word:nth-child(3){ animation-delay:0.49s; }

@keyframes wordIn{
  0%{ opacity:0;transform:translateY(28px) scale(0.96);filter:blur(8px); }
  60%{ filter:blur(0); }
  100%{ opacity:1;transform:translateY(0) scale(1);filter:blur(0); }
}

/* ── Underline accent that draws in beneath text ── */
.accent-line{
  display:block;
  height:2px;
  width:0;
  margin:24px auto 0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.85),transparent);
  border-radius:2px;
  animation:lineDraw 0.9s 0.7s var(--ease) forwards;
}
.scene.active .accent-line{ animation-play-state:running; }
@keyframes lineDraw{
  0%{ width:0;opacity:0; }
  100%{ width:min(180px,40%);opacity:1; }
}

/* ── Soft glow halo behind text ── */
.text-halo{
  position:absolute;
  top:50%;left:50%;
  width:140%;height:200%;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,255,255,0.10) 0%,transparent 60%);
  pointer-events:none;
  filter:blur(20px);
  opacity:0;
  animation:haloIn 1.2s 0.2s ease forwards;
}
.scene.active .text-halo{ animation-play-state:running; }
@keyframes haloIn{
  0%{ opacity:0;transform:translate(-50%,-50%) scale(0.7); }
  100%{ opacity:1;transform:translate(-50%,-50%) scale(1); }
}

/* ── Ambient floating particles ── */
.particle{
  position:fixed;
  border-radius:50%;
  background:rgba(255,255,255,0.4);
  pointer-events:none;
  z-index:3;
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{ transform:translateY(100vh) scale(0.6);opacity:0; }
  10%{ opacity:0.7; }
  90%{ opacity:0.4; }
  100%{ transform:translateY(-10vh) scale(1);opacity:0; }
}

/* ── Special "Dropping Soon" emphasis ── */
.scene[data-emphasis="true"] .scene-text{
  font-size:clamp(26px,6vw,72px);
}
.scene[data-emphasis="true"] .scene-text .word:last-child{
  background:linear-gradient(135deg,#ffffff 0%,#cfddff 50%,#ffffff 100%);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:wordIn 0.85s var(--ease-spring) forwards, shineFlow 3s 1.2s ease-in-out infinite;
}
@keyframes shineFlow{
  0%,100%{ background-position:0% 50%; }
  50%{ background-position:100% 50%; }
}

/* ── Progress bar ── */
#progress{
  position:fixed;top:0;left:0;height:3px;
  background:linear-gradient(90deg,rgba(255,255,255,0.4),rgba(255,255,255,0.95),rgba(255,255,255,0.4));
  z-index:200;
  transition:width 0.12s linear;
  box-shadow:0 0 10px rgba(255,255,255,0.5);
}

/* ── Mobile ── */
@media (max-width:640px){
  .scene-text{ font-size:clamp(22px,8vw,46px); }
  .scene[data-emphasis="true"] .scene-text{ font-size:clamp(20px,7.5vw,40px); }
}
</style>
</head>
<body>

<div id="bg-glow"></div>
<div id="bg-grid"></div>
<div id="vignette"></div>

<div id="stage">
  <section class="scene" data-text="Introducing Golex">
    <div class="text-wrap">
      <div class="text-halo"></div>
      <h1 class="scene-text"><span class="word">Introducing</span> <span class="word">Golex</span></h1>
      <span class="accent-line"></span>
    </div>
  </section>

  <section class="scene" data-text="Skill Based">
    <div class="text-wrap">
      <div class="text-halo"></div>
      <h1 class="scene-text"><span class="word">Skill</span> <span class="word">Based</span></h1>
      <span class="accent-line"></span>
    </div>
  </section>

  <section class="scene" data-text="Conversational App">
    <div class="text-wrap">
      <div class="text-halo"></div>
      <h1 class="scene-text"><span class="word">Conversational</span> <span class="word">App</span></h1>
      <span class="accent-line"></span>
    </div>
  </section>

  <section class="scene" data-text="Hire">
    <div class="text-wrap">
      <div class="text-halo"></div>
      <h1 class="scene-text"><span class="word">Hire</span></h1>
      <span class="accent-line"></span>
    </div>
  </section>

  <section class="scene" data-text="Collaborate">
    <div class="text-wrap">
      <div class="text-halo"></div>
      <h1 class="scene-text"><span class="word">Collaborate</span></h1>
      <span class="accent-line"></span>
    </div>
  </section>

  <section class="scene" data-text="Work">
    <div class="text-wrap">
      <div class="text-halo"></div>
      <h1 class="scene-text"><span class="word">Work</span></h1>
      <span class="accent-line"></span>
    </div>
  </section>

  <section class="scene" data-text="Comprehensive">
    <div class="text-wrap">
      <div class="text-halo"></div>
      <h1 class="scene-text"><span class="word">Comprehensive</span></h1>
      <span class="accent-line"></span>
    </div>
  </section>

  <section class="scene" data-emphasis="true" data-text="Dropping Soon">
    <div class="text-wrap">
      <div class="text-halo"></div>
      <h1 class="scene-text"><span class="word">Dropping</span> <span class="word">Soon</span></h1>
      <span class="accent-line"></span>
    </div>
  </section>
</div>

<div id="progress"></div>

<script>
/* ── Scene durations (ms) ── */
const SCENES = [
  { dur: 2400 }, // Introducing Golex
  { dur: 2200 }, // Skill Based
  { dur: 2400 }, // Conversational App
  { dur: 2000 }, // Hire
  { dur: 2200 }, // Collaborate
  { dur: 2000 }, // Work
  { dur: 2300 }, // Comprehensive
  { dur: 3200 }, // Dropping Soon (longer for impact)
];

const scenes = document.querySelectorAll('.scene');
let curr = 0;
let sceneStart = Date.now();

function activate(idx){
  scenes.forEach((s, i) => {
    if (i === idx) {
      s.classList.remove('exit');
      // Reset word animations by toggling class
      s.querySelectorAll('.word').forEach(w => {
        w.style.animation = 'none';
        void w.offsetWidth;
        w.style.animation = '';
      });
      s.querySelectorAll('.accent-line, .text-halo').forEach(el => {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });
      s.classList.add('active');
    } else if (s.classList.contains('active')) {
      s.classList.remove('active');
      s.classList.add('exit');
      setTimeout(() => s.classList.remove('exit'), 700);
    }
  });
}

function tick(){
  const elapsed = Date.now() - sceneStart;
  const dur = SCENES[curr].dur;
  const pct = Math.min(elapsed / dur, 1) * 100;
  document.getElementById('progress').style.width = pct + '%';

  if (elapsed >= dur) {
    curr = (curr + 1) % SCENES.length;
    sceneStart = Date.now();
    activate(curr);
  }
  requestAnimationFrame(tick);
}

/* ── Floating particles for ambient depth ── */
function spawnParticles(){
  for (let i = 0; i < 18; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 3 + 1.5;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (Math.random() * 12 + 10) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    p.style.opacity = (Math.random() * 0.4 + 0.2);
    document.body.appendChild(p);
  }
}

/* ── Click / keyboard advance ── */
document.addEventListener('click', () => {
  curr = (curr + 1) % SCENES.length;
  sceneStart = Date.now();
  activate(curr);
});
document.addEventListener('keydown', e => {
  if (e.code === 'ArrowRight' || e.code === 'Space'){
    e.preventDefault();
    curr = (curr + 1) % SCENES.length;
    sceneStart = Date.now();
    activate(curr);
  } else if (e.code === 'ArrowLeft'){
    e.preventDefault();
    curr = (curr - 1 + SCENES.length) % SCENES.length;
    sceneStart = Date.now();
    activate(curr);
  }
});

window.addEventListener('DOMContentLoaded', () => {
  spawnParticles();
  activate(0);
  tick();
});
</script>
</body>
</html>
