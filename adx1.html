<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golex — Product Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --g-accent:#2357E8;
  --g-accent-light:#3B7CF6;
  --g-bg:#EEF2F8;
  --g-surface:#FFFFFF;
  --g-text:#0F172A;
  --g-text2:#475569;
  --g-muted:#94A3B8;
  --g-border:rgba(15,23,42,0.07);
}

body{
  background:#04080F;
  overflow:hidden;
  width:100vw;height:100vh;
  font-family:'Outfit',sans-serif;
}

#bg{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  z-index:0;
  opacity:0.7;
}

/* STAGE */
#stage{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:52px;
}

/* PHONE WRAP */
#phone-wrap{
  position:relative;
  transition:transform 1s cubic-bezier(0.4,0,0.2,1),
             opacity 0.5s;
  will-change:transform;
}
#phone-wrap.dolly-in{transform:scale(1.14) translateX(-12px)}
#phone-wrap.dolly-out{transform:scale(0.92) translateX(12px)}
#phone-wrap.tilt{transform:perspective(800px) rotateY(-6deg) rotateX(3deg) scale(1.02)}

/* PHONE FRAME */
#phone{
  width:316px;
  height:672px;
  background:#080B14;
  border-radius:48px;
  border:10px solid #131825;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.07),
    0 0 0 1px rgba(0,0,0,0.9),
    0 2px 0 2px rgba(255,255,255,0.03),
    0 60px 140px rgba(0,0,0,0.8),
    0 0 100px rgba(35,87,232,0.12),
    0 0 40px rgba(35,87,232,0.06);
  position:relative;
  overflow:hidden;
}

/* Side buttons */
#phone::before{
  content:'';
  position:absolute;
  left:-14px;top:120px;
  width:4px;height:36px;
  background:#1A1F30;
  border-radius:2px 0 0 2px;
  box-shadow:0 44px 0 #1A1F30;
}
#phone::after{
  content:'';
  position:absolute;
  right:-14px;top:140px;
  width:4px;height:60px;
  background:#1A1F30;
  border-radius:0 2px 2px 0;
}

/* Dynamic Island */
#di{
  position:absolute;
  top:10px;left:50%;
  transform:translateX(-50%);
  width:96px;height:30px;
  background:#000;
  border-radius:20px;
  z-index:200;
  transition:width 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
#di.active-call{width:120px}

/* Status bar */
#statusbar{
  position:absolute;
  top:0;left:0;right:0;
  height:48px;
  z-index:150;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 22px 0;
  font-size:11px;font-weight:600;
  color:rgba(15,23,42,0.7);
  letter-spacing:0.3px;
}
#statusbar.dark{color:rgba(255,255,255,0.55)}
#sb-time{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500}
#sb-icons{display:flex;align-items:center;gap:5px;font-size:10px}

/* SCREEN */
#screen-inner{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  overflow:hidden;
}

.s{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  animation:sIn 0.38s cubic-bezier(0.4,0,0.2,1) forwards;
}
.s.out{
  animation:sOut 0.32s cubic-bezier(0.4,0,0.2,1) forwards;
  pointer-events:none;
}

@keyframes sIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes sOut{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-5px)}
}

/* COPY PANEL */
#copy-wrap{
  width:260px;
  min-width:200px;
}
#copy-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:3px;
  color:rgba(59,124,246,0.7);
  text-transform:uppercase;
  margin-bottom:12px;
  opacity:0;
  transition:opacity 0.4s;
}
#copy-main{
  font-family:'Syne',sans-serif;
  font-size:34px;
  font-weight:800;
  color:#FFFFFF;
  line-height:1.05;
  letter-spacing:-0.5px;
  opacity:0;
  transform:translateY(8px);
  transition:opacity 0.45s,transform 0.45s;
}
#copy-sub{
  font-size:13px;
  line-height:1.6;
  color:rgba(255,255,255,0.42);
  margin-top:14px;
  opacity:0;
  transition:opacity 0.4s 0.12s;
  max-width:220px;
}
#copy-wrap.show #copy-tag,
#copy-wrap.show #copy-main,
#copy-wrap.show #copy-sub{opacity:1;transform:none}

/* PROGRESS */
#pbar{
  position:fixed;
  bottom:28px;left:50%;
  transform:translateX(-50%);
  width:200px;height:3px;
  background:rgba(255,255,255,0.06);
  border-radius:3px;
  z-index:200;
  overflow:hidden;
}
#pfill{
  height:100%;
  background:linear-gradient(90deg,#1A46CC,#2357E8,#3B7CF6);
  border-radius:3px;
  width:0%;
  transition:width 0.3s ease;
  box-shadow:0 0 8px rgba(35,87,232,0.5);
}

/* === SCREEN STYLES === */

/* Bottom Nav */
.bnav{
  position:absolute;
  bottom:0;left:0;right:0;
  background:rgba(248,249,252,0.95);
  border-top:1px solid rgba(15,23,42,0.07);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:6px 4px 22px;
  z-index:100;
}
.bnav.dark{background:rgba(6,10,18,0.98);border-top-color:rgba(148,163,200,0.07)}
.bnav-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:8px;font-weight:600;color:#94A3B8;padding:4px 8px;
  font-family:'JetBrains Mono',monospace;letter-spacing:0.3px;text-transform:uppercase;
  border-radius:8px;
  transition:color 0.15s;
}
.bnav-btn svg{width:20px;height:20px;stroke-width:1.75;display:block;transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1)}
.bnav-btn.active{color:#2357E8}
.bnav-btn.active svg{transform:translateY(-2px)}
.bnav.dark .bnav-btn.active{color:#4F8EF7}
/* create-btn: gradient pill, no label */
.bnav-btn.create-btn{
  background:linear-gradient(135deg,#2357E8,#1A46CC);
  border-radius:12px;padding:8px 16px;margin:-2px 0;
  box-shadow:0 4px 16px rgba(35,87,232,0.35);
  color:#fff;
}
.bnav-btn.create-btn svg{transform:none!important}
.bnav.dark .bnav-btn.create-btn{background:linear-gradient(135deg,#4F8EF7,#3574E8);box-shadow:0 4px 16px rgba(79,142,247,0.35)}

/* App header */
.app-hdr{
  background:rgba(255,255,255,0.90);
  padding:52px 16px 14px;
  border-bottom:1px solid rgba(15,23,42,0.07);
}
.app-hdr.dark{background:rgba(12,17,32,1);border-bottom-color:rgba(148,163,200,0.07)}
.app-hdr-title{
  font-family:'Syne',sans-serif;
  font-size:20px;font-weight:800;color:#0F172A;
  letter-spacing:-0.3px;
}
.app-hdr.dark .app-hdr-title{color:#DDE5F4}

/* Search bar */
.search-bar{
  background:#F1F5F9;border-radius:12px;
  padding:10px 14px;
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:#94A3B8;margin-top:10px;
  border:1px solid rgba(15,23,42,0.05);
}
.search-bar svg{width:14px;height:14px;stroke:#94A3B8;flex-shrink:0}

/* User card — matches real app .user-item exactly */
.ucard{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:12px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(15,23,42,0.07);
  cursor:pointer;margin-bottom:6px;
  animation:cardIn 0.4s ease backwards;
  transition:border-color 0.15s,background 0.15s;
}
.ucard:hover{background:rgba(35,87,232,0.08);border-color:rgba(35,87,232,0.18);}
.uav{
  width:42px;height:42px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;color:#fff;
  flex-shrink:0;font-family:'JetBrains Mono',monospace;
}
.ubody{flex:1;min-width:0}
.uname{font-size:14px;font-weight:700;color:#0F172A;letter-spacing:-0.1px;}
.uskill{font-size:10px;font-family:'JetBrains Mono',monospace;color:#94A3B8;margin-top:3px;}
.ulevel{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 8px;border-radius:9999px;display:inline-block;margin-top:4px;letter-spacing:0.3px;}
.ulevel.beginner{background:rgba(110,101,96,0.15);color:#64748B;border:1px solid rgba(110,101,96,0.25);}
.ulevel.intermediate{background:rgba(5,150,105,0.08);color:#10B981;border:1px solid rgba(5,150,105,0.22);}
.ulevel.advanced{background:rgba(35,87,232,0.09);color:#2357E8;border:1px solid rgba(35,87,232,0.22);}
.ulevel.pro{background:rgba(245,158,11,0.12);color:#F59E0B;border:1px solid rgba(245,158,11,0.3);}
.umsg-btn{
  font-size:10px;font-weight:700;
  background:rgba(35,87,232,0.08);color:#2357E8;
  border:1px solid rgba(35,87,232,0.22);border-radius:9999px;
  padding:5px 12px;cursor:pointer;flex-shrink:0;
  font-family:'JetBrains Mono',monospace;
}.ucard:nth-child(1){animation-delay:0.05s}
.ucard:nth-child(2){animation-delay:0.12s}
.ucard:nth-child(3){animation-delay:0.19s}
.ucard:nth-child(4){animation-delay:0.26s}

@keyframes cardIn{
  from{opacity:0;transform:translateX(-8px)}
  to{opacity:1;transform:none}
}

.uav{
  width:44px;height:44px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#fff;
  flex-shrink:0;
}
.ubody{flex:1;min-width:0}
.uname{font-size:13px;font-weight:700;color:#0F172A;letter-spacing:-0.2px;}
.uskill{font-size:10px;color:#2357E8;margin-top:1px;font-weight:600}
.ulevel{font-size:9px;background:rgba(35,87,232,0.08);color:#2357E8;padding:2px 8px;border-radius:20px;display:inline-block;margin-top:3px;font-weight:600;border:1px solid rgba(35,87,232,0.15);}
.umsg-btn{
  font-size:10px;font-weight:700;
  background:rgba(35,87,232,0.08);color:#2357E8;
  border:1px solid rgba(35,87,232,0.15);border-radius:20px;
  padding:5px 12px;cursor:pointer;
  flex-shrink:0;
}

/* Chat */
.chat-hdr{
  background:rgba(255,255,255,0.90);
  padding:52px 14px 12px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(15,23,42,0.07);
}
.chat-hdr.dark{background:rgba(12,17,32,1);border-bottom-color:rgba(148,163,200,0.07)}
.chat-back{
  width:30px;height:30px;border-radius:8px;
  border:1.5px solid rgba(15,23,42,0.1);
  display:flex;align-items:center;justify-content:center;
  background:transparent;cursor:pointer;flex-shrink:0;
}
.chat-back svg{width:14px;height:14px;stroke:#0F172A;stroke-width:2.5}
.chat-av{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.chat-av img{width:100%;height:100%;border-radius:10px;object-fit:cover}
.chat-hdr-info{flex:1;min-width:0}
.chat-hdr-name{font-size:13px;font-weight:700;color:#0F172A}
.chat-hdr.dark .chat-hdr-name{color:#DDE5F4}
.chat-hdr-status{font-size:10px;color:#059669;display:flex;align-items:center;gap:4px}
.chat-hdr-actions{display:flex;gap:6px}
.chat-icon-btn{width:30px;height:30px;border:1.5px solid rgba(15,23,42,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;background:transparent;cursor:pointer}
.chat-icon-btn svg{width:13px;height:13px;stroke:#475569;stroke-width:2}

.chat-msgs{
  position:absolute;top:102px;left:0;right:0;bottom:60px;
  padding:12px;
  overflow:hidden;
  display:flex;flex-direction:column;gap:6px;
}
.msg{display:flex;flex-direction:column;gap:2px}
.msg.sent{align-items:flex-end}
.msg.recv{align-items:flex-start}
.msg-bubble{
  max-width:75%;padding:10px 14px;border-radius:16px;
  font-size:13px;line-height:1.55;word-break:break-word;
  animation:msgIn 0.3s cubic-bezier(0.34,1.56,0.64,1) backwards;
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}
.msg.sent .msg-bubble{
  background:linear-gradient(145deg,#2357E8,#1A46CC);
  color:#fff;
  border-bottom-right-radius:4px;
  box-shadow:0 3px 14px rgba(35,87,232,0.22);
}
.msg.recv .msg-bubble{
  background:#FFFFFF;color:#0F172A;
  border:1px solid rgba(15,23,42,0.07);
  border-bottom-left-radius:4px;
  box-shadow:0 2px 8px rgba(15,23,42,0.12),0 1px 3px rgba(35,87,232,0.08);
}
.msg-time{font-size:9px;color:#94A3B8;padding:0 2px;font-family:'JetBrains Mono',monospace;}

/* Voice note bubble */
.vn-bubble{
  background:#fff;border-radius:12px;
  padding:8px 12px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 2px 8px rgba(15,23,42,0.08);
}
.vn-play{
  width:28px;height:28px;background:#2357E8;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.vn-play svg{width:10px;height:10px;fill:#fff;stroke:none}
.vn-wave{display:flex;align-items:center;gap:2px;flex:1}
.vn-bar{width:3px;border-radius:2px;background:#E2E8F0;animation:waveAnim 0.8s ease-in-out infinite}
@keyframes waveAnim{
  0%,100%{height:4px}
  50%{height:16px}
}
.vn-dur{font-size:10px;color:#94A3B8;font-family:'JetBrains Mono',monospace}

/* File bubble */
.file-bubble{
  background:#fff;border-radius:12px;
  padding:10px 12px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 2px 8px rgba(15,23,42,0.08);
  max-width:80%;
}
.file-icon{width:32px;height:32px;background:#EFF6FF;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-icon svg{width:16px;height:16px;stroke:#2357E8;stroke-width:2}
.file-name{font-size:11px;font-weight:600;color:#0F172A}
.file-size{font-size:9px;color:#94A3B8}

/* Chat input */
.chat-input-area{
  position:absolute;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid rgba(15,23,42,0.06);
  padding:8px 10px 14px;
  display:flex;align-items:center;gap:6px;
}
.chat-input-area.dark{background:#0C1120;border-top-color:rgba(148,163,200,0.06)}
.chat-attach{width:30px;height:30px;border:1.5px solid rgba(15,23,42,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;background:transparent;cursor:pointer;flex-shrink:0}
.chat-attach svg,.chat-mic svg{width:14px;height:14px;stroke:#475569;stroke-width:2}
.chat-mic{width:30px;height:30px;border:1.5px solid rgba(15,23,42,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;background:transparent;cursor:pointer;flex-shrink:0}
.chat-textbox{flex:1;background:#F1F5F9;border:none;border-radius:10px;padding:8px 12px;font-size:12px;color:#0F172A;outline:none;font-family:'Outfit',sans-serif}
.chat-send{width:30px;height:30px;background:linear-gradient(135deg,#2357E8,#1A46CC);border-radius:8px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0}
.chat-send svg{width:12px;height:12px;stroke:#fff;stroke-width:2.5}

/* CALL SCREEN */
.call-screen{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
  position:relative;
}
.call-bg{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(160deg,#04080F 0%,#0A1628 50%,#08122A 100%);
}
.call-bg::before{
  content:'';position:absolute;
  top:30%;left:50%;
  width:240px;height:240px;
  background:radial-gradient(circle,rgba(35,87,232,0.12) 0%,transparent 70%);
  transform:translate(-50%,-50%);
  animation:callPulse 2s ease-in-out infinite;
}
@keyframes callPulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.6}
  50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
}
.call-avatar{
  width:80px;height:80px;border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700;color:#fff;
  position:relative;z-index:1;
  margin-bottom:14px;
  box-shadow:0 0 0 4px rgba(35,87,232,0.2),0 0 0 8px rgba(35,87,232,0.08);
}
.call-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;color:#fff;position:relative;z-index:1}
.call-status{font-size:12px;color:rgba(255,255,255,0.5);margin-top:4px;position:relative;z-index:1;font-family:'JetBrains Mono',monospace}
.call-status.connected{color:#10B981}
.call-btns{
  display:flex;gap:20px;margin-top:48px;position:relative;z-index:1;
}
.call-btn{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:none;cursor:pointer;
}
.call-btn svg{width:20px;height:20px;stroke:#fff;stroke-width:2}
.call-btn.end{background:#EF4444}
.call-btn.mute{background:rgba(255,255,255,0.12)}
.call-btn.speaker{background:rgba(255,255,255,0.12)}
.call-btn.video-on{background:linear-gradient(135deg,#2357E8,#1A46CC)}

/* Video Call */
.vcall-screen{
  width:100%;height:100%;
  position:relative;
  background:#050A14;
}
.vcall-main{
  width:100%;height:100%;
  background:linear-gradient(135deg,#0D1628,#142040,#0D1628);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:rgba(255,255,255,0.3);
  font-family:'JetBrains Mono',monospace;
}
.vcall-self{
  position:absolute;top:60px;right:12px;
  width:75px;height:100px;
  background:linear-gradient(135deg,#152030,#1e3050);
  border-radius:12px;
  border:2px solid rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
.vcall-name-tag{
  position:absolute;bottom:80px;left:16px;
  background:rgba(0,0,0,0.6);
  border-radius:8px;padding:4px 8px;
  font-size:11px;color:#fff;
}
.vcall-btns{
  position:absolute;bottom:20px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:14px;
}
.vcall-btn{
  width:44px;height:44px;border-radius:50%;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.vcall-btn svg{width:18px;height:18px;stroke:#fff;stroke-width:2}
.vcall-btn.end-call{background:#EF4444}
.vcall-btn.toggle{background:rgba(255,255,255,0.12)}

/* Explore / Feed */
.feed-screen{
  background:#EEF2F8;
  height:100%;
  display:flex;flex-direction:column;
}
.feed-tabs{
  background:#fff;
  display:flex;
  border-bottom:1px solid rgba(15,23,42,0.06);
  padding:0 16px;
}
.feed-tab{
  font-size:12px;font-weight:600;
  padding:10px 12px;
  color:#94A3B8;
  border-bottom:2px solid transparent;
  cursor:pointer;
  transition:all 0.2s;
}
.feed-tab.active{color:#2357E8;border-bottom-color:#2357E8}

/* Post card */
.post-card{
  background:rgba(255,255,255,0.95);border-radius:18px;
  padding:14px;margin-bottom:10px;
  border:1px solid rgba(15,23,42,0.07);
  animation:cardIn 0.35s ease backwards;
  position:relative;overflow:hidden;
}
.post-card:hover{border-color:rgba(35,87,232,0.25)}
.post-card:nth-child(1){animation-delay:0.04s}
.post-card:nth-child(2){animation-delay:0.12s}
.post-card:nth-child(3){animation-delay:0.2s}
.post-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.post-av{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;border:1px solid rgba(15,23,42,0.07);}
.post-author{font-size:13px;font-weight:700;color:#0F172A}
.post-skill-tag{font-size:10px;font-family:'JetBrains Mono',monospace;color:#3B7CF6;background:rgba(35,87,232,0.1);padding:2px 8px;border-radius:9999px;border:1px solid rgba(35,87,232,0.2);display:inline-block;margin-top:2px;}
.post-time{font-size:9px;color:#94A3B8;margin-left:auto;font-family:'JetBrains Mono',monospace;}
.post-body{font-size:12px;line-height:1.55;color:#0F172A;margin-bottom:10px;word-break:break-word;}
.post-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.post-tag{font-size:11px;padding:3px 10px;border-radius:9999px;background:rgba(5,150,105,0.07);border:1px solid rgba(5,150,105,0.18);color:#10B981;font-family:'JetBrains Mono',monospace;}
.post-actions{display:flex;gap:6px;align-items:center;padding-top:8px;border-top:1px solid rgba(15,23,42,0.06)}
.post-action{
  display:flex;align-items:center;gap:5px;
  padding:6px 10px;border-radius:12px;
  border:1px solid rgba(15,23,42,0.07);background:none;
  font-size:11px;color:#94A3B8;cursor:pointer;transition:all 0.15s;
  font-family:'Outfit',sans-serif;
}
.post-action svg{width:13px;height:13px;stroke:#94A3B8;stroke-width:1.75;fill:none;transition:all 0.15s}
.post-action.liked{color:#f472b6;border-color:rgba(244,114,182,0.35);background:rgba(244,114,182,0.06)}
.post-action.liked svg{stroke:#f472b6;fill:#f472b6}
.post-action.connect{color:#2357E8;border-color:rgba(35,87,232,0.3);background:rgba(35,87,232,0.08)}
.post-action.connect svg{stroke:#2357E8}

/* Community card */
.comm-card{
  background:#fff;border-radius:16px;
  padding:12px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(15,23,42,0.10),0 1px 3px rgba(35,87,232,0.07);
  border:1px solid rgba(15,23,42,0.04);
  animation:cardIn 0.35s ease backwards;
}
.comm-card:nth-child(1){animation-delay:0.05s}
.comm-card:nth-child(2){animation-delay:0.13s}
.comm-card:nth-child(3){animation-delay:0.21s}
.comm-card:nth-child(4){animation-delay:0.29s}
.comm-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.comm-name{font-size:13px;font-weight:700;color:#0F172A}
.comm-meta{font-size:10px;color:#94A3B8;margin-top:1px}
.comm-join-btn{
  margin-left:auto;flex-shrink:0;
  font-size:10px;font-weight:700;
  background:linear-gradient(135deg,#2357E8,#1A46CC);
  color:#fff;border:none;border-radius:20px;
  padding:6px 12px;cursor:pointer;
  box-shadow:0 3px 12px rgba(35,87,232,0.3);
}
.comm-join-btn.joined{background:rgba(5,150,105,0.1);color:#059669;border:1px solid rgba(5,150,105,0.2);box-shadow:none;border-radius:20px;}

/* Community post */
.cpost{
  background:#fff;border-radius:16px;
  padding:12px;margin-bottom:8px;
  box-shadow:0 2px 8px rgba(15,23,42,0.10),0 1px 3px rgba(35,87,232,0.07);
  border:1px solid rgba(15,23,42,0.04);
}
.cpost-title{font-size:13px;font-weight:700;color:#0F172A;margin-bottom:4px}
.cpost-body{font-size:11px;color:#475569;line-height:1.5}
.cpost-votes{display:flex;align-items:center;gap:6px;margin-top:10px}
.vote-btn{
  width:26px;height:26px;border-radius:7px;
  border:1.5px solid rgba(15,23,42,0.1);
  background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;transition:all 0.2s;
}
.vote-btn.up.active{background:rgba(35,87,232,0.08);border-color:#2357E8;color:#2357E8}
.vote-btn.down.active{background:#FFF5F5;border-color:#EF4444;color:#EF4444}
.vote-count{font-size:12px;font-weight:700;color:#0F172A}
.cpost-badge{font-size:9px;font-weight:700;background:rgba(35,87,232,0.08);color:#2357E8;padding:2px 9px;border-radius:20px;margin-left:auto;border:1px solid rgba(35,87,232,0.15);}

/* Rooms */
.room-card{
  background:#fff;border-radius:16px;
  padding:12px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(15,23,42,0.10),0 1px 3px rgba(35,87,232,0.07);
  border:1px solid rgba(15,23,42,0.04);
  animation:cardIn 0.35s ease backwards;
}
/* Projects */
.proj-card{
  background:#fff;border-radius:16px;
  padding:14px;margin-bottom:8px;
  box-shadow:0 2px 8px rgba(15,23,42,0.10),0 1px 3px rgba(35,87,232,0.07);
  border:1px solid rgba(15,23,42,0.04);
  animation:cardIn 0.35s ease backwards;
}
.proj-card-name{font-size:13px;font-weight:700;color:#0F172A}
.proj-card-desc{font-size:11px;color:#475569;margin-top:3px;line-height:1.4}
.proj-card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.proj-tag{font-size:9px;background:rgba(35,87,232,0.08);color:#2357E8;padding:2px 9px;border-radius:20px;font-weight:600;border:1px solid rgba(35,87,232,0.12);}
.proj-card-footer{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(15,23,42,0.05)}
.proj-members{display:flex}
.proj-mav{width:20px;height:20px;border-radius:6px;border:2px solid #fff;margin-left:-4px;first:margin-left:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff}
.proj-card-btn{font-size:10px;font-weight:700;margin-left:auto;background:linear-gradient(135deg,#2357E8,#1A46CC);color:#fff;border:none;border-radius:20px;padding:6px 14px;cursor:pointer;box-shadow:0 3px 10px rgba(35,87,232,0.3);}
.room-icon{width:40px;height:40px;border-radius:12px;background:rgba(35,87,232,0.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(35,87,232,0.12);}
.room-icon svg{width:18px;height:18px;stroke:#2357E8;stroke-width:2}
.room-name{font-size:12px;font-weight:700;color:#0F172A}
.room-meta{font-size:9px;color:#94A3B8;margin-top:2px}
.room-live{font-size:9px;background:rgba(5,150,105,0.1);color:#059669;padding:3px 9px;border-radius:20px;font-weight:700;margin-left:auto;border:1px solid rgba(5,150,105,0.15);}
/* Workspace */
.ws-screen{background:#EEF2F8;height:100%;display:flex;flex-direction:column}
.ws-hdr{
  background:rgba(255,255,255,0.90);padding:52px 14px 12px;
  border-bottom:1px solid rgba(15,23,42,0.07);
  display:flex;align-items:center;gap:8px;
}
.ws-hdr.dark{background:rgba(12,17,32,1);border-bottom-color:rgba(148,163,200,0.07)}
.ws-back{width:28px;height:28px;border-radius:7px;border:1.5px solid rgba(15,23,42,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ws-back svg{width:12px;height:12px;stroke:#475569;stroke-width:2.5}
.ws-title-wrap{flex:1;min-width:0}
.ws-title{font-size:14px;font-weight:700;color:#0F172A}
.ws-sub{font-size:9px;color:#94A3B8;margin-top:1px}
.ws-hdr.dark .ws-title{color:#DDE5F4}
.ws-tabs{background:#fff;display:flex;gap:0;border-bottom:1px solid rgba(15,23,42,0.06);padding:0 12px}
.ws-tabs.dark{background:#0C1120;border-bottom-color:rgba(148,163,200,0.06)}
.ws-tab{font-size:10px;font-weight:600;color:#94A3B8;padding:8px 10px;border-bottom:2px solid transparent;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.ws-tab.active{color:#2357E8;border-bottom-color:#2357E8}
.ws-tabs.dark .ws-tab.active{color:#4F8EF7;border-bottom-color:#4F8EF7}
.ws-content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* Kanban */
.kanban-wrap{
  display:flex;gap:8px;padding:10px;
  flex:1;overflow:hidden;
}
.kanban-col{
  flex:1;background:rgba(255,255,255,0.6);
  border-radius:12px;padding:8px;
  display:flex;flex-direction:column;gap:6px;
  min-width:0;
}
.kanban-col.dark{background:rgba(12,17,32,0.5)}
.kanban-col-hdr{font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.kanban-col-hdr .col-dot{width:6px;height:6px;border-radius:50%}
.k-card{
  background:#fff;border-radius:9px;padding:8px;
  box-shadow:0 2px 6px rgba(15,23,42,0.06);
  animation:cardIn 0.3s ease backwards;
}
.k-card.dark{background:#0A0F1E;box-shadow:none}
.k-card-title{font-size:10px;font-weight:700;color:#0F172A;line-height:1.3}
.k-card.dark .k-card-title{color:#DDE5F4}
.k-card-assign{
  margin-top:6px;display:flex;align-items:center;gap:5px;
}
.k-av{width:16px;height:16px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff}
.k-assign-name{font-size:9px;color:#94A3B8}

/* Sketchboard */
.sketch-screen{background:#fff;height:100%;display:flex;flex-direction:column;position:relative}
.sketch-hdr{padding:52px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(15,23,42,0.06)}
.sketch-hdr.dark{background:#0C1120;border-bottom-color:rgba(148,163,200,0.06)}
.sketch-tools{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#F8FAFF;border-bottom:1px solid rgba(15,23,42,0.06)}
.sk-tool{width:28px;height:28px;border-radius:7px;border:1.5px solid rgba(15,23,42,0.1);display:flex;align-items:center;justify-content:center;background:transparent;cursor:pointer}
.sk-tool.active{background:#EFF6FF;border-color:#2357E8}
.sk-tool svg{width:13px;height:13px;stroke:#475569;stroke-width:2}
.sk-tool.active svg{stroke:#2357E8}
.sketch-canvas{flex:1;position:relative;overflow:hidden}
.sketch-canvas svg{width:100%;height:100%}

/* Notifications screen */
.notif-hdr{background:rgba(255,255,255,0.90);padding:52px 16px 14px;border-bottom:1px solid rgba(15,23,42,0.07)}
.notif-hdr.dark{background:rgba(12,17,32,1);border-bottom-color:rgba(148,163,200,0.07)}
.notif-item{
  background:#fff;
  border-radius:16px;
  padding:11px 12px;
  margin-bottom:8px;
  display:flex;align-items:flex-start;gap:10px;
  box-shadow:0 2px 8px rgba(15,23,42,0.10),0 1px 3px rgba(35,87,232,0.07);
  border:1px solid rgba(15,23,42,0.04);
  animation:cardIn 0.35s ease backwards;
}
.notif-item.unread{background:#F0F7FF;border-left:3px solid #2357E8;border-radius:16px;}
.notif-item:nth-child(1){animation-delay:0.04s}
.notif-item:nth-child(2){animation-delay:0.1s}
.notif-item:nth-child(3){animation-delay:0.16s}
.notif-icon-wrap{width:34px;height:34px;border-radius:10px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-icon-wrap svg{width:15px;height:15px;stroke:#2357E8;stroke-width:2}
.notif-icon-wrap.green{background:#ECFDF5}
.notif-icon-wrap.green svg{stroke:#059669}
.notif-text{flex:1;min-width:0}
.notif-title{font-size:11px;font-weight:600;color:#0F172A;line-height:1.4}
.notif-time{font-size:9px;color:#94A3B8;margin-top:2px;font-family:'JetBrains Mono',monospace}

/* Profile screen */
.profile-screen{background:#EEF2F8;height:100%;display:flex;flex-direction:column}
.profile-hdr{background:rgba(255,255,255,0.90);padding:52px 16px 16px;border-bottom:1px solid rgba(15,23,42,0.07);}
.profile-hdr.dark{background:rgba(12,17,32,1);border-bottom-color:rgba(148,163,200,0.07)}
.profile-av-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.profile-av-big{
  width:64px;height:64px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;color:#fff;
  box-shadow:0 6px 24px rgba(35,87,232,0.35);
}
.profile-name{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#0F172A}
.profile-handle{font-size:11px;color:#94A3B8;font-family:'JetBrains Mono',monospace;margin-top:1px}
.profile-hdr.dark .profile-name{color:#DDE5F4}
.profile-hdr.dark .profile-handle{color:rgba(79,142,247,0.6)}
.pro-badge{font-size:9px;font-weight:700;background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;padding:2px 8px;border-radius:20px;letter-spacing:0.5px;vertical-align:middle;}
.profile-bio{font-size:11px;color:#475569;line-height:1.5;margin-top:6px}
.profile-follow-row{display:flex;gap:16px;margin-top:10px}
.profile-follow-stat{text-align:center}
.profile-follow-num{font-size:15px;font-weight:700;color:#0F172A}
.profile-follow-lbl{font-size:9px;color:#94A3B8}
.profile-hdr.dark .profile-follow-num{color:#DDE5F4}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.stat-chip{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 8px rgba(15,23,42,0.10),0 1px 3px rgba(35,87,232,0.07);border:1px solid rgba(15,23,42,0.04);}
.stat-chip.dark{background:#0C1120;box-shadow:none;border:1px solid rgba(148,163,200,0.06)}
.stat-val{font-size:17px;font-weight:800;color:#0F172A}
.stat-val.blue{color:#2357E8}
.stat-val.green{color:#059669}
.stat-val.dark-v{color:#DDE5F4}
.stat-lbl{font-size:9px;color:#94A3B8;margin-top:2px;display:flex;align-items:center;gap:4px}
.stat-lbl svg{width:10px;height:10px;stroke:#94A3B8;stroke-width:2}

/* Skills section */
.skills-section{padding:0 16px 12px}
.skills-title{font-size:11px;font-weight:700;color:#0F172A;margin-bottom:8px}
.skills-section.dark .skills-title{color:#DDE5F4}
.skill-chip{display:inline-block;font-size:10px;font-weight:600;background:rgba(35,87,232,0.08);color:#2357E8;padding:4px 10px;border-radius:20px;margin:0 4px 4px 0;border:1px solid rgba(35,87,232,0.15);}
.skill-chip.dark{background:rgba(79,142,247,0.09);color:#7AABF9;border:1px solid rgba(79,142,247,0.2)}

/* Theme toggle */
.theme-row{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-radius:14px;margin:0 16px 8px;box-shadow:0 2px 8px rgba(15,23,42,0.10),0 1px 3px rgba(35,87,232,0.07);border:1px solid rgba(15,23,42,0.04);}
.theme-row.dark{background:#0C1120;border:1px solid rgba(148,163,200,0.06);box-shadow:none;}
.theme-label{font-size:12px;font-weight:600;color:#0F172A;flex:1}
.theme-label.dark-v{color:#DDE5F4}
.theme-toggle{width:40px;height:22px;background:#E2E8F0;border-radius:11px;position:relative;cursor:pointer;transition:background 0.3s}
.theme-toggle.on{background:#2357E8}
.theme-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform 0.3s;box-shadow:0 1px 4px rgba(0,0,0,0.2)}
.theme-toggle.on .theme-knob{transform:translateX(18px)}

/* PRO screen */
.pro-screen{
  background:#04080F;
  height:100%;
  display:flex;flex-direction:column;
  align-items:center;
  padding-top:60px;
}
.pro-logo{
  font-family:'Syne',sans-serif;
  font-size:26px;font-weight:800;
  letter-spacing:3px;
  background:linear-gradient(135deg,#7AABF9,#4F8EF7,#22D3EE);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:4px;
}
.pro-badge-big{
  font-size:11px;font-weight:700;
  background:linear-gradient(135deg,#F59E0B,#D97706);
  color:#fff;padding:3px 10px;border-radius:8px;
  letter-spacing:1px;margin-bottom:24px;
}
.pro-feature{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 16px;
  width:100%;
  animation:proFeatureIn 0.4s ease backwards;
}
.pro-feature:nth-child(4){animation-delay:0.08s}
.pro-feature:nth-child(5){animation-delay:0.16s}
.pro-feature:nth-child(6){animation-delay:0.24s}
.pro-feature:nth-child(7){animation-delay:0.32s}
.pro-feature:nth-child(8){animation-delay:0.40s}
@keyframes proFeatureIn{
  from{opacity:0;transform:translateX(-12px)}
  to{opacity:1;transform:none}
}
.pro-feature-icon{
  width:30px;height:30px;border-radius:8px;
  background:rgba(79,142,247,0.1);
  border:1px solid rgba(79,142,247,0.18);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.pro-feature-icon svg{width:13px;height:13px;stroke:#4F8EF7;stroke-width:2}
.pro-feature-text{flex:1;min-width:0}
.pro-feature-title{font-size:12px;font-weight:700;color:#DDE5F4}
.pro-feature-desc{font-size:10px;color:#4D6080;margin-top:1px;line-height:1.4}
.pro-price-row{
  margin-top:auto;margin-bottom:0;
  padding:16px 16px 8px;
  width:100%;
  border-top:1px solid rgba(148,163,200,0.06);
}
.pro-price{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#FFFFFF}
.pro-price span{font-size:13px;font-weight:400;color:#4D6080}
.pro-cta{
  width:calc(100% - 32px);
  margin:12px 16px 24px;
  padding:13px;
  background:linear-gradient(135deg,#4F8EF7,#3574E8);
  color:#fff;
  font-size:14px;font-weight:700;
  border:none;border-radius:14px;cursor:pointer;
  box-shadow:0 4px 24px rgba(79,142,247,0.35);
  letter-spacing:0.3px;
}

/* Dev theme bg */
.dev-bg{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:#060A12;
  pointer-events:none;
  z-index:0;
}
.dev-grid{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background-image:linear-gradient(rgba(79,142,247,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(79,142,247,0.018) 1px,transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  z-index:1;
}

/* CREATE SCREEN */
.create-screen{background:#fff;height:100%;display:flex;flex-direction:column}
.create-hdr{padding:52px 16px 14px;border-bottom:1px solid rgba(15,23,42,0.06)}
.create-hdr-row{display:flex;align-items:center;justify-content:space-between}
.create-hdr-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:#0F172A}
.create-post-btn{
  font-size:12px;font-weight:700;
  background:linear-gradient(135deg,#2357E8,#1A46CC);
  color:#fff;border:none;border-radius:10px;
  padding:8px 14px;cursor:pointer;
  box-shadow:0 3px 12px rgba(35,87,232,0.3);
}
.create-content{flex:1;padding:14px 16px;overflow:hidden}
.create-textarea{
  width:100%;min-height:100px;
  border:1.5px solid rgba(15,23,42,0.1);

.create-toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.create-tool-btn{
  font-size:10px;font-weight:600;
  background:#F1F5F9;color:#475569;
  border:none;border-radius:8px;
  padding:5px 10px;cursor:pointer;
  display:flex;align-items:center;gap:4px;
}
.create-tool-btn svg{width:11px;height:11px;stroke:#475569;stroke-width:2}
.create-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}

/* GUILDS */
.guild-hdr{background:#fff;padding:52px 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(15,23,42,0.06)}
.guild-name-big{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#0F172A}
.guild-count{font-size:10px;color:#94A3B8}

/* Focus overlay */
.focus-vignette{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(circle at 50% 50%,transparent 25%,rgba(4,8,15,0.65) 100%);
  pointer-events:none;z-index:50;
  opacity:0;
  transition:opacity 0.5s;
}
.focus-vignette.show{opacity:1}

/* Screen shimmer for loading */
@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}
@keyframes loadBar{
  0%{width:0%}
  20%{width:15%}
  50%{width:45%}
  80%{width:72%}
  100%{width:100%}
}
@keyframes pulse{
  0%,100%{opacity:1}50%{opacity:0.5}
}
@keyframes recDot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.3;transform:scale(0.7)}
}
@keyframes spin{
  to{transform:rotate(360deg)}
}

/* Cursor blinking in inputs */
@keyframes blink{
  0%,49%{opacity:1}
  50%,100%{opacity:0}
}

/* People grid */
.people-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.people-card{
  background:#fff;border-radius:16px;padding:12px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 2px 8px rgba(15,23,42,0.10),0 1px 3px rgba(35,87,232,0.07);
  border:1px solid rgba(15,23,42,0.04);
  animation:cardIn 0.35s ease backwards;
}
.people-av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.people-name{font-size:11px;font-weight:700;color:#0F172A;text-align:center}
.people-skill{font-size:9px;color:#2357E8;font-weight:600;text-align:center}
.people-follow-btn{font-size:9px;font-weight:700;background:rgba(35,87,232,0.08);color:#2357E8;border:1px solid rgba(35,87,232,0.15);border-radius:20px;padding:4px 12px;cursor:pointer;margin-top:2px}

/* Toast notification */
.toast{
  position:absolute;top:60px;left:12px;right:12px;
  background:#0F172A;color:#fff;
  border-radius:12px;padding:10px 12px;
  font-size:11px;font-weight:600;
  z-index:300;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
  animation:toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes toastIn{
  from{opacity:0;transform:translateY(-10px) scale(0.95)}
  to{opacity:1;transform:none}
}
.toast-dot{width:7px;height:7px;background:#10B981;border-radius:50%;flex-shrink:0}

/* Audio call eq bars */
.eq-bars{display:flex;align-items:center;gap:3px;margin-top:8px}
.eq-bar{
  width:4px;border-radius:2px;
  background:rgba(35,87,232,0.5);
  animation:eqAnim 0.6s ease-in-out infinite;
}
@keyframes eqAnim{0%,100%{height:4px}50%{height:18px}}

/* Joining animation */
@keyframes joinPop{
  from{opacity:0;transform:scale(0.8)}
  to{opacity:1;transform:scale(1)}
}

/* Highlight pulse for specific elements */
@keyframes hlPulse{
  0%{box-shadow:0 0 0 0 rgba(35,87,232,0.3)}
  70%{box-shadow:0 0 0 6px rgba(35,87,232,0)}
  100%{box-shadow:0 0 0 0 rgba(35,87,232,0)}
}
.highlight-pulse{animation:hlPulse 1.2s ease-out 2}

/* End card */
#end-card{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:#04080F;
  z-index:1000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:12px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.8s;
}
#end-card.show{opacity:1;pointer-events:auto}
.end-logo{
  font-family:'Syne',sans-serif;
  font-size:52px;font-weight:800;
  letter-spacing:8px;
  background:linear-gradient(135deg,#FFFFFF 0%,#A0BCFF 50%,#2357E8 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  opacity:0;
  transform:scale(0.85);
  transition:opacity 0.7s 0.3s,transform 0.7s 0.3s;
}
#end-card.show .end-logo{opacity:1;transform:none}
.end-tagline{
  font-size:14px;
  color:rgba(255,255,255,0.35);
  font-family:'JetBrains Mono',monospace;
  letter-spacing:3px;
  opacity:0;
  transition:opacity 0.6s 0.8s;
}
#end-card.show .end-tagline{opacity:1}
.end-url{
  font-size:12px;color:rgba(35,87,232,0.6);
  font-family:'JetBrains Mono',monospace;
  letter-spacing:1px;margin-top:20px;
  opacity:0;
  transition:opacity 0.5s 1.2s;
}
#end-card.show .end-url{opacity:1}

/* Responsive */
@media(max-width:700px){
  #copy-wrap{display:none}
  #stage{gap:0}
}

<script>
// ════════════════════════════════════════
//  THREE.JS BACKGROUND
// ════════════════════════════════════════
(function(){
  const canvas = document.getElementById('bg');
  const W = window.innerWidth, H = window.innerHeight;
  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:false});
  renderer.setSize(W,H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(55, W/H, 0.1, 1000);
  cam.position.z = 85;

  const N = 110;
  const pos = new Float32Array(N*3);
  const vel = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]   = (Math.random()-0.5)*160;
    pos[i*3+1] = (Math.random()-0.5)*110;
    pos[i*3+2] = (Math.random()-0.5)*60;
    vel[i*3]   = (Math.random()-0.5)*0.025;
    vel[i*3+1] = (Math.random()-0.5)*0.018;
    vel[i*3+2] = 0;
  }

  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const pMat = new THREE.PointsMaterial({color:0x1A46CC, size:1.2, transparent:true, opacity:0.55});
  const pts = new THREE.Points(pGeo,pMat);
  scene.add(pts);

  // Lines
  const linePositions = new Float32Array(N*N*6);
  const lGeo = new THREE.BufferGeometry();
  lGeo.setAttribute('position', new THREE.BufferAttribute(linePositions,3));
  lGeo.setDrawRange(0,0);
  const lMat = new THREE.LineSegments ? new THREE.LineBasicMaterial({color:0x1A3A88, transparent:true, opacity:0.2}) : null;
  if(lMat){
    const lines = new THREE.LineSegments(lGeo, lMat);
    scene.add(lines);
  }

  let lineCount = 0;
  const DIST = 28;

  function animate(){
    requestAnimationFrame(animate);
    const p = pGeo.attributes.position.array;
    for(let i=0;i<N;i++){
      p[i*3]   += vel[i*3];
      p[i*3+1] += vel[i*3+1];
      if(p[i*3]>80)  p[i*3]=-80;
      if(p[i*3]<-80) p[i*3]=80;
      if(p[i*3+1]>55)  p[i*3+1]=-55;
      if(p[i*3+1]<-55) p[i*3+1]=55;
    }
    pGeo.attributes.position.needsUpdate = true;

    // Update lines
    if(lMat){
      lineCount = 0;
      const la = lGeo.attributes.position.array;
      for(let i=0;i<N;i++){
        for(let j=i+1;j<N;j++){
          const dx=p[i*3]-p[j*3], dy=p[i*3+1]-p[j*3+1];
          const d2=dx*dx+dy*dy;
          if(d2 < DIST*DIST){
            const base=lineCount*6;
            la[base]=p[i*3];la[base+1]=p[i*3+1];la[base+2]=p[i*3+2];
            la[base+3]=p[j*3];la[base+4]=p[j*3+1];la[base+5]=p[j*3+2];
            lineCount++;
            if(lineCount>=N*N/2) break;
          }
        }
        if(lineCount>=N*N/2) break;
      }
      lGeo.attributes.position.needsUpdate = true;
      lGeo.setDrawRange(0, lineCount*2);
    }

    pts.rotation.y += 0.0003;
    renderer.render(scene, cam);
  }
  animate();
  window.addEventListener('resize',()=>{
    renderer.setSize(window.innerWidth,window.innerHeight);
    cam.aspect=window.innerWidth/window.innerHeight;
    cam.updateProjectionMatrix();
  });
})();

function mkScreen(html, sb_dark=false){

  return mkScreen(`

      <div class="chat-icon-btn"><svg viewBox="0 0 24 24" fill="none"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></div>
    </div>
  </div>
  <div class="chat-msgs">${msgsHtml}${vnHtml}${fileHtml}</div>

function setScreen(el){
  if(curEl){
    curEl.classList.add('out');
    const old = curEl;
    setTimeout(()=>old.remove(), 350);
  }
  screen.appendChild(el);
  curEl = el;
}

function setCopy(tag, main, sub){
  copyWrap.classList.remove('show');
  setTimeout(()=>{
    copyTag.textContent  = tag||'';
    copyMain.textContent = main||'';
    copySub.textContent  = sub||'';
    if(main) copyWrap.classList.add('show');
  }, 200);
}

function setCamera(mode){
  phoneWrap.classList.remove('dolly-in','dolly-out','tilt');
  if(mode) setTimeout(()=>phoneWrap.classList.add(mode), 80);
}

const TOTAL_DURATION = 68.8;

function tick(ts){
  if(!startTime) startTime = ts;
  const t = (ts - startTime) / 1000;

  pfill.style.width = Math.min(100, (t / TOTAL_DURATION) * 100) + '%';

  // Find which scene we should be on
  let sceneIdx = -1;
  for(let i=0; i<SCENES.length; i++){
    if(t >= SCENES[i][0]) sceneIdx = i;
  }

  if(sceneIdx !== curScene && sceneIdx >= 0){
    curScene = sceneIdx;
    const [st, dur, buildFn, cam, tag, main, sub] = SCENES[sceneIdx];
    setScreen(buildFn());
    setCamera(cam);
    setCopy(tag, main, sub);
    // Control vignette
    setVignette(cam === 'dolly-in');
  }

  // End card
  if(t >= TOTAL_DURATION - 0.5 && t < TOTAL_DURATION + 5){
    if(!endCard.classList.contains('show')){
      endCard.classList.add('show');
    }
  }

  if(t < TOTAL_DURATION + 6) requestAnimationFrame(tick);
}

// Start on interaction or auto-start after 0.5s
document.body.addEventListener('click', ()=>{
  if(!startTime) requestAnimationFrame(tick);
}, {once:true});
setTimeout(()=>{
  if(!startTime) requestAnimationFrame(tick);
}, 500);

// Replay button on end
endCard.addEventListener('click', ()=>{
  endCard.classList.remove('show');
  startTime = null;
  curScene  = -1;
  curEl     = null;
  setTimeout(()=>requestAnimationFrame(tick), 100);
});
